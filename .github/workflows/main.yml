name: Build signed release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    name: Test and build owner-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # 2. Set up Java
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # =========================================================
      # 3. Set up Android SDK command-line tools
      # =========================================================
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      # =========================================================
      # 4. Install available stable Android API 36
      # =========================================================
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are not set."
            exit 1
          fi

          echo "Android SDK root: $SDK_ROOT"

          echo "SDK Manager version:"
          sdkmanager --version

          echo "Installing Android API 36..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          if [[ ! -d "$SDK_ROOT/platforms/android-36" ]]; then
            echo "::error::Android API 36 was not installed."
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "::error::Android Build Tools 36.0.0 were not installed."
            exit 1
          fi

          echo "Android API 36 installed successfully."

      # =========================================================
      # 5. Change API 37 dependencies to API 36 only on runner
      # Nothing is committed back to repository
      # =========================================================
      - name: Configure project for available Android API 36
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          file_path = Path("app/build.gradle.kts")
          content = file_path.read_text(encoding="utf-8")

          replacements = {
              'compileSdk = 37': 'compileSdk = 36',
              'targetSdk = 37': 'targetSdk = 36',
              'androidx.compose:compose-bom:2026.08.00':
                  'androidx.compose:compose-bom:2026.06.01',
              'androidx.core:core-ktx:1.19.0':
                  'androidx.core:core-ktx:1.18.0',
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(
                      f"Expected Gradle configuration was not found: {old}"
                  )
              content = content.replace(old, new)

          file_path.write_text(content, encoding="utf-8")
          PY

          echo "Effective Android configuration:"
          grep -nE \
            "compileSdk|targetSdk|compose-bom|core-ktx" \
            app/build.gradle.kts

          if ! grep -q "compileSdk = 36" app/build.gradle.kts; then
            echo "::error::compileSdk was not changed to API 36."
            exit 1
          fi

          if ! grep -q "targetSdk = 36" app/build.gradle.kts; then
            echo "::error::targetSdk was not changed to API 36."
            exit 1
          fi

          echo "Project configured for API 36 on this runner."

      # =========================================================
      # 6. Set up Gradle
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 7. Validate required signing secrets
      # =========================================================
      - name: Validate required GitHub secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          MISSING_SECRET=0

          for SECRET_NAME in \
            KEYSTORE_BASE64 \
            STORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [[ -z "${!SECRET_NAME:-}" ]]; then
              echo "::error::Missing GitHub repository secret: $SECRET_NAME"
              MISSING_SECRET=1
            fi
          done

          if [[ "$MISSING_SECRET" -ne 0 ]]; then
            echo "::error::Add all required repository secrets."
            exit 1
          fi

          echo "All required signing secrets are available."

      # =========================================================
      # 8. Restore only the owner's keystore
      # =========================================================
      - name: Restore owner keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$GITHUB_WORKSPACE/wordbattle-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "WORD_BATTLE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Owner keystore restored successfully."
          echo "Keystore size: $(wc -c < "$KEYSTORE_PATH") bytes"

      # =========================================================
      # 9. Verify store password and key alias
      # =========================================================
      - name: Validate owner keystore and alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ ! -s "$WORD_BATTLE_KEYSTORE_PATH" ]]; then
            echo "::error::Owner keystore is unavailable."
            exit 1
          fi

          keytool -list \
            -keystore "$WORD_BATTLE_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore password and alias are valid."

      # =========================================================
      # 10. Verify ENABLE1 dictionary
      # =========================================================
      - name: Verify bundled ENABLE dictionary
        shell: bash
        run: |
          set -euo pipefail

          DICTIONARY_PATH="app/src/main/assets/dictionary/enable1.txt"

          if [[ ! -s "$DICTIONARY_PATH" ]]; then
            echo "::error::ENABLE1 dictionary is missing or empty."
            exit 1
          fi

          WORD_COUNT="$(wc -l < "$DICTIONARY_PATH")"

          echo "ENABLE1 word count: $WORD_COUNT"

          if [[ "$WORD_COUNT" -lt 170000 ]]; then
            echo "::error::ENABLE1 dictionary is incomplete."
            exit 1
          fi

          echo "ENABLE1 dictionary verified successfully."

      # =========================================================
      # 11. Make Gradle wrapper executable
      # =========================================================
      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # =========================================================
      # 12. Run unit tests
      # No debug APK is generated
      # =========================================================
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            testDebugUnitTest \
            --stacktrace

      # =========================================================
      # 13. Build release APK using only owner keystore
      # =========================================================
      - name: Build owner-signed release APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WORD_BATTLE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WORD_BATTLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORD_BATTLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! -s "$WORD_BATTLE_KEYSTORE_PATH" ]]; then
            echo "::error::Owner keystore is unavailable."
            exit 1
          fi

          ./gradlew \
            --no-daemon \
            assembleRelease \
            --stacktrace

      # =========================================================
      # 14. Verify APK and extract SHA-1 / SHA-256 fingerprints
      # =========================================================
      - name: Verify APK and generate signing fingerprints
        id: signing_fingerprints
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Release APK was not generated: $APK_PATH"
            exit 1
          fi

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found: $APKSIGNER"
            exit 1
          fi

          echo "Verifying signed release APK..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee signing-certificate.txt

          SHA1_FINGERPRINT="$(
            sed -n \
              's/^Signer #1 certificate SHA-1 digest: //p' \
              signing-certificate.txt \
              | head -n 1 \
              | tr -d '\r'
          )"

          SHA256_FINGERPRINT="$(
            sed -n \
              's/^Signer #1 certificate SHA-256 digest: //p' \
              signing-certificate.txt \
              | head -n 1 \
              | tr -d '\r'
          )"

          if [[ -z "$SHA1_FINGERPRINT" ]]; then
            echo "::error::Unable to extract SHA-1 fingerprint."
            exit 1
          fi

          if [[ -z "$SHA256_FINGERPRINT" ]]; then
            echo "::error::Unable to extract SHA-256 fingerprint."
            exit 1
          fi

          {
            echo "WORD BATTLE APK SIGNING FINGERPRINTS"
            echo "===================================="
            echo
            echo "Package name: com.wordbattle.com"
            echo
            echo "SHA-1:"
            echo "$SHA1_FINGERPRINT"
            echo
            echo "SHA-256:"
            echo "$SHA256_FINGERPRINT"
          } | tee signing-fingerprints.txt

          echo
          echo "============================================================"
          echo "FINAL SIGNED APK CERTIFICATE FINGERPRINTS"
          echo "============================================================"
          echo "Package  : com.wordbattle.com"
          echo "SHA-1    : $SHA1_FINGERPRINT"
          echo "SHA-256  : $SHA256_FINGERPRINT"
          echo "============================================================"

          echo "sha1=$SHA1_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_FINGERPRINT" >> "$GITHUB_OUTPUT"

          {
            echo "## 🔐 APK Signing Certificate Fingerprints"
            echo
            echo "| Type | Fingerprint |"
            echo "|---|---|"
            echo "| **SHA-1** | \`$SHA1_FINGERPRINT\` |"
            echo "| **SHA-256** | \`$SHA256_FINGERPRINT\` |"
            echo
            echo "**Package name:** \`com.wordbattle.com\`"
            echo
            echo "Fingerprints were extracted from the final signed release APK."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "APK signature and fingerprints verified successfully."

      # =========================================================
      # 15. Prepare APK, checksum and fingerprint files
      # =========================================================
      - name: Prepare signed APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          mkdir -p signed-artifact

          OUTPUT_APK="signed-artifact/WordBattle-v1.0.0-build-${GITHUB_RUN_NUMBER}-signed.apk"

          cp "$APK_PATH" "$OUTPUT_APK"

          cp \
            signing-certificate.txt \
            signed-artifact/signing-certificate.txt

          cp \
            signing-fingerprints.txt \
            signed-artifact/signing-fingerprints.txt

          sha256sum "$OUTPUT_APK" \
            | tee signed-artifact/SHA256SUMS.txt

          echo "Prepared files:"
          ls -lh signed-artifact/

      # =========================================================
      # 16. Upload signed APK artifact
      # =========================================================
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordBattle-signed-${{ github.run_number }}
          path: signed-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # =========================================================
      # 17. Attach APK to GitHub Release for v* tags
      # =========================================================
      - name: Attach signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG_NAME="$GITHUB_REF_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$TAG_NAME" \
              signed-artifact/* \
              --clobber
          else
            gh release create \
              "$TAG_NAME" \
              signed-artifact/* \
              --title "Word Battle $TAG_NAME" \
              --generate-notes
          fi

      # =========================================================
      # 18. Always remove temporary keystore
      # =========================================================
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/wordbattle-release.jks"
          echo "Temporary owner keystore removed."
