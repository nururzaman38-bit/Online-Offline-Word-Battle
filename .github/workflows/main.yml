name: Build signed release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: word-battle-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    name: Build JKS signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LC_ALL: C
      LANG: C

    steps:
      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # =========================================================
      # 3. Android SDK command-line tools
      # =========================================================
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      # =========================================================
      # 4. Install API 36
      # =========================================================
      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ ! -d "$SDK_ROOT/platforms/android-36" ]]; then
            echo "::error::Android API 36 was not installed."
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "::error::Android Build Tools 36.0.0 were not installed."
            exit 1
          fi

          echo "Android API 36 is ready."

      # =========================================================
      # 5. Temporary API 36 dependency compatibility
      # Nothing is committed
      # =========================================================
      - name: Configure project for Android API 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("app/build.gradle.kts was not found")

          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "compileSdk = 37",
                  "compileSdk = 36"
              ),
              (
                  "targetSdk = 37",
                  "targetSdk = 36"
              ),
              (
                  "androidx.compose:compose-bom:2026.08.00",
                  "androidx.compose:compose-bom:2026.06.01"
              ),
              (
                  "androidx.core:core-ktx:1.19.0",
                  "androidx.core:core-ktx:1.18.0"
              ),
              (
                  "androidx.lifecycle:lifecycle-runtime-compose:2.11.0",
                  "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
              ),
              (
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0",
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  print(f"Changed: {old} -> {new}")
              elif new in text:
                  print(f"Already configured: {new}")
              else:
                  print(f"Not found, skipped: {old}")

          path.write_text(text, encoding="utf-8")
          PY

          echo "Effective build configuration:"

          grep -nE \
            'compileSdk|targetSdk|compose-bom|core-ktx|lifecycle-runtime-compose|lifecycle-viewmodel-compose' \
            app/build.gradle.kts || true

          if ! grep -q 'compileSdk = 36' app/build.gradle.kts; then
            echo "::error::compileSdk is not 36."
            exit 1
          fi

      # =========================================================
      # 6. Gradle cache
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 7. Validate Secrets
      # =========================================================
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FAILED=0

          for NAME in \
            KEYSTORE_BASE64 \
            STORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [[ -z "${!NAME:-}" ]]; then
              echo "::error::Missing repository secret: $NAME"
              FAILED=1
            else
              echo "$NAME is configured."
            fi
          done

          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

      # =========================================================
      # 8. Decode JKS
      # =========================================================
      - name: Restore JKS keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          value = os.environ.get("KEYSTORE_BASE64", "")
          value = "".join(value.split())

          if not value:
              raise SystemExit("KEYSTORE_BASE64 is empty")

          try:
              data = base64.b64decode(
                  value,
                  validate=True
              )
          except binascii.Error as error:
              raise SystemExit(
                  f"KEYSTORE_BASE64 is invalid: {error}"
              )

          if len(data) < 100:
              raise SystemExit(
                  f"Decoded JKS is too small: {len(data)} bytes"
              )

          output = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "wordbattle-release.jks"
          )

          output.write_bytes(data)

          print(f"JKS restored: {output}")
          print(f"JKS size: {len(data)} bytes")
          PY

          KEYSTORE_PATH="$GITHUB_WORKSPACE/wordbattle-release.jks"

          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::JKS file is empty."
            exit 1
          fi

          echo "WORD_BATTLE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          ls -lh "$KEYSTORE_PATH"

      # =========================================================
      # 9. Validate JKS
      # =========================================================
      - name: Validate JKS keystore and alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +e

          keytool -list \
            -v \
            -storetype JKS \
            -keystore "$WORD_BATTLE_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > keystore-information.txt 2>&1

          STATUS=$?

          set -e

          cat keystore-information.txt

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::JKS validation failed."
            echo "::error::Check STORE_PASSWORD, KEY_ALIAS and KEYSTORE_BASE64."
            exit 1
          fi

          if ! grep -q "PrivateKeyEntry" keystore-information.txt; then
            echo "::error::The selected alias is not a PrivateKeyEntry."
            exit 1
          fi

          echo "JKS keystore, password and alias are valid."

      # =========================================================
      # 10. Verify dictionary
      # =========================================================
      - name: Verify ENABLE1 dictionary
        shell: bash
        run: |
          FILE="app/src/main/assets/dictionary/enable1.txt"

          if [[ ! -s "$FILE" ]]; then
            echo "::error::ENABLE1 dictionary is missing."
            exit 1
          fi

          COUNT="$(wc -l < "$FILE")"

          echo "ENABLE1 word count: $COUNT"

          if [[ "$COUNT" -lt 170000 ]]; then
            echo "::error::ENABLE1 dictionary is incomplete."
            exit 1
          fi

      # =========================================================
      # 11. Gradle wrapper
      # =========================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      # =========================================================
      # 12. Test and build
      # =========================================================
      - name: Test and build signed release APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WORD_BATTLE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WORD_BATTLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORD_BATTLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ ! -s "$WORD_BATTLE_KEYSTORE_PATH" ]]; then
            echo "::error::JKS keystore is unavailable."
            exit 1
          fi

          echo "Running unit tests..."

          ./gradlew \
            --no-daemon \
            testDebugUnitTest \
            --stacktrace

          echo "Building signed release APK..."

          ./gradlew \
            --no-daemon \
            assembleRelease \
            --stacktrace

      # =========================================================
      # 13. Locate APK
      # =========================================================
      - name: Locate release APK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APK_PATH="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "::error::Release APK was not found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$APKSIGNER" >> "$GITHUB_ENV"

          echo "APK: $APK_PATH"
          echo "apksigner: $APKSIGNER"

      # =========================================================
      # 14. Verify signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          "$APKSIGNER_PATH" verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee apk-certificate.txt

      # =========================================================
      # 15. Generate SHA-1 and SHA-256
      # =========================================================
      - name: Generate signing fingerprints
        id: fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          apk_text = Path("apk-certificate.txt").read_text(
              encoding="utf-8",
              errors="replace"
          )

          keytool_text = Path("keystore-information.txt").read_text(
              encoding="utf-8",
              errors="replace"
          )

          sha1_match = re.search(
              r"certificate SHA-1 digest:\s*([0-9a-fA-F:]+)",
              apk_text,
              re.IGNORECASE
          )

          sha256_match = re.search(
              r"certificate SHA-256 digest:\s*([0-9a-fA-F:]+)",
              apk_text,
              re.IGNORECASE
          )

          if not sha1_match:
              sha1_match = re.search(
                  r"SHA1:\s*([0-9a-fA-F:]+)",
                  keytool_text,
                  re.IGNORECASE
              )

          if not sha256_match:
              sha256_match = re.search(
                  r"SHA256:\s*([0-9a-fA-F:]+)",
                  keytool_text,
                  re.IGNORECASE
              )

          if not sha1_match:
              raise SystemExit("SHA-1 fingerprint was not found")

          if not sha256_match:
              raise SystemExit("SHA-256 fingerprint was not found")

          def format_fingerprint(value):
              clean = re.sub(
                  r"[^0-9a-fA-F]",
                  "",
                  value
              ).upper()

              return ":".join(
                  clean[index:index + 2]
                  for index in range(0, len(clean), 2)
              )

          sha1 = format_fingerprint(
              sha1_match.group(1)
          )

          sha256 = format_fingerprint(
              sha256_match.group(1)
          )

          content = f"""WORD BATTLE SIGNING CERTIFICATE
          =================================

          Package name: com.wordbattle.com
          Keystore type: JKS

          SHA-1:
          {sha1}

          SHA-256:
          {sha256}
          """

          Path("signing-fingerprints.txt").write_text(
              content,
              encoding="utf-8"
          )

          print("=" * 60)
          print("FINAL APK SIGNING FINGERPRINTS")
          print("=" * 60)
          print("Package  : com.wordbattle.com")
          print(f"SHA-1    : {sha1}")
          print(f"SHA-256  : {sha256}")
          print("=" * 60)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"sha1={sha1}\n")
              output.write(f"sha256={sha256}\n")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as summary:
              summary.write("## 🔐 APK Signing Certificate\n\n")
              summary.write("| Type | Fingerprint |\n")
              summary.write("|---|---|\n")
              summary.write(f"| **SHA-1** | `{sha1}` |\n")
              summary.write(f"| **SHA-256** | `{sha256}` |\n\n")
              summary.write("**Package:** `com.wordbattle.com`\n\n")
              summary.write("**Keystore:** JKS\n")
          PY

          cat signing-fingerprints.txt

      # =========================================================
      # 16. Prepare artifact
      # =========================================================
      - name: Prepare signed APK artifact
        shell: bash
        run: |
          mkdir -p signed-artifact

          OUTPUT_APK="signed-artifact/WordBattle-build-${GITHUB_RUN_NUMBER}-signed.apk"

          cp "$APK_PATH" "$OUTPUT_APK"
          cp apk-certificate.txt signed-artifact/apk-certificate.txt
          cp signing-fingerprints.txt signed-artifact/signing-fingerprints.txt

          sha256sum "$OUTPUT_APK" \
            | tee signed-artifact/SHA256SUMS.txt

          ls -lh signed-artifact

      # =========================================================
      # 17. Upload artifact
      # =========================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WordBattle-JKS-signed-${{ github.run_number }}
          path: signed-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # =========================================================
      # 18. Optional GitHub Release
      # =========================================================
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              signed-artifact/* \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              signed-artifact/* \
              --title "Word Battle $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # =========================================================
      # 19. Delete temporary JKS
      # =========================================================
      - name: Remove temporary JKS
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/wordbattle-release.jks"
          echo "Temporary JKS removed."
