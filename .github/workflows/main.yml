name: Build signed release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: word-battle-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    name: Build PKCS12 signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LC_ALL: C
      LANG: C

    steps:
      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Set up Java 21
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # =========================================================
      # 3. Set up Android SDK 36
      # =========================================================
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # =========================================================
      # 4. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK installation
        shell: bash
        run: |
          trap 'echo "::error::SDK verification failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are not set."
            exit 1
          fi

          echo "Android SDK root: $SDK_ROOT"

          echo "Java version:"
          java -version

          echo "SDK Manager version:"
          sdkmanager --version

          if [[ ! -d "$SDK_ROOT/platforms/android-36" ]]; then
            echo "::error::Android API 36 is missing."
            sdkmanager --list || true
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "::error::Android Build Tools 36.0.0 are missing."
            sdkmanager --list || true
            exit 1
          fi

          echo "Android SDK 36 is ready."

      # =========================================================
      # 5. Configure project temporarily for API 36
      # Nothing is committed to repository
      # =========================================================
      - name: Configure project for Android API 36
        shell: bash
        run: |
          trap 'echo "::error::API 36 compatibility step failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("app/build.gradle.kts was not found")

          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "compileSdk = 37",
                  "compileSdk = 36"
              ),
              (
                  "targetSdk = 37",
                  "targetSdk = 36"
              ),
              (
                  "androidx.compose:compose-bom:2026.08.00",
                  "androidx.compose:compose-bom:2026.06.01"
              ),
              (
                  "androidx.core:core-ktx:1.19.0",
                  "androidx.core:core-ktx:1.18.0"
              ),
              (
                  "androidx.lifecycle:lifecycle-runtime-compose:2.11.0",
                  "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
              ),
              (
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0",
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  print(f"Changed: {old} -> {new}")
              elif new in text:
                  print(f"Already configured: {new}")
              else:
                  print(f"Warning: version was not found: {old}")

          path.write_text(text, encoding="utf-8")
          PY

          echo
          echo "Effective Android configuration:"

          grep -nE \
            'compileSdk|targetSdk|compose-bom|core-ktx|lifecycle-runtime-compose|lifecycle-viewmodel-compose' \
            app/build.gradle.kts || true

          if ! grep -q 'compileSdk = 36' app/build.gradle.kts; then
            echo "::error::compileSdk is not configured as 36."
            exit 1
          fi

          if ! grep -q 'targetSdk = 36' app/build.gradle.kts; then
            echo "::error::targetSdk is not configured as 36."
            exit 1
          fi

      # =========================================================
      # 6. Set up Gradle cache
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 7. Validate repository secrets
      # =========================================================
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          trap 'echo "::error::Secret validation failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          FAILED=0

          for NAME in \
            KEYSTORE_BASE64 \
            STORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [[ -z "${!NAME:-}" ]]; then
              echo "::error::Missing GitHub repository secret: $NAME"
              FAILED=1
            else
              echo "$NAME is configured."
            fi
          done

          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

          echo "All required signing secrets are configured."

      # =========================================================
      # 8. Restore PKCS12 from KEYSTORE_BASE64
      # =========================================================
      - name: Restore PKCS12 keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          trap 'echo "::error::PKCS12 restore failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          encoded = os.environ.get("KEYSTORE_BASE64", "")
          encoded = "".join(encoded.split())

          if not encoded:
              raise SystemExit("KEYSTORE_BASE64 is empty")

          try:
              decoded = base64.b64decode(
                  encoded,
                  validate=True
              )
          except binascii.Error as error:
              raise SystemExit(
                  f"KEYSTORE_BASE64 is invalid: {error}"
              )

          if len(decoded) < 100:
              raise SystemExit(
                  f"Decoded file is too small: {len(decoded)} bytes"
              )

          output = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "wordbattle-release.p12"
          )

          output.write_bytes(decoded)

          print(f"Restored PKCS12: {output}")
          print(f"Decoded size: {len(decoded)} bytes")
          PY

          KEYSTORE_PATH="$GITHUB_WORKSPACE/wordbattle-release.p12"

          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded PKCS12 file is empty."
            exit 1
          fi

          echo "WORD_BATTLE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "PKCS12 file restored successfully:"
          ls -lh "$KEYSTORE_PATH"

      # =========================================================
      # 9. Diagnose and validate PKCS12
      # Shows real keytool error instead of hiding it
      # =========================================================
      - name: Diagnose and validate PKCS12 keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -u

          KEYSTORE="$WORD_BATTLE_KEYSTORE_PATH"
          STORE_LOG="pkcs12-store-information.txt"
          PRIVATE_ALIASES="private-key-aliases.txt"

          echo "============================================================"
          echo "PKCS12 KEYSTORE DIAGNOSTICS"
          echo "============================================================"
          echo "Keystore path: $KEYSTORE"

          if [[ ! -f "$KEYSTORE" ]]; then
            echo "::error::Keystore file does not exist: $KEYSTORE"
            exit 1
          fi

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Keystore file is empty."
            exit 1
          fi

          echo
          echo "File information:"
          ls -lh "$KEYSTORE"
          file "$KEYSTORE" || true

          echo
          echo "Keystore file SHA-256 checksum:"
          sha256sum "$KEYSTORE" || true

          echo
          echo "Testing PKCS12 format and STORE_PASSWORD..."

          set +e

          keytool -list \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            > "$STORE_LOG" 2>&1

          STORE_STATUS=$?

          set -e

          echo
          echo "================ KEYTOOL OUTPUT ================"
          cat "$STORE_LOG"
          echo "============== END KEYTOOL OUTPUT =============="

          if [[ "$STORE_STATUS" -ne 0 ]]; then
            echo
            echo "::error::Unable to open the PKCS12 keystore."
            echo "::error::Possible reasons:"
            echo "::error::1. STORE_PASSWORD is incorrect."
            echo "::error::2. KEYSTORE_BASE64 is incomplete."
            echo "::error::3. The uploaded file is not a real PKCS12 keystore."
            exit 1
          fi

          echo
          echo "PKCS12 format and STORE_PASSWORD are valid."

          awk -F': ' '
            /^Alias name: / {
              current_alias=$2
            }

            /^Entry type: PrivateKeyEntry/ {
              if (current_alias != "") {
                print current_alias
              }
            }
          ' "$STORE_LOG" > "$PRIVATE_ALIASES"

          echo
          echo "Private-key aliases found:"

          if [[ ! -s "$PRIVATE_ALIASES" ]]; then
            echo "No PrivateKeyEntry alias was found."
            echo "::error::This PKCS12 file has no signing private key."
            exit 1
          fi

          cat "$PRIVATE_ALIASES"

          echo
          echo "Checking configured KEY_ALIAS..."

          if ! grep -Fxq "$KEY_ALIAS" "$PRIVATE_ALIASES"; then
            echo "::error::KEY_ALIAS does not match any PrivateKeyEntry."
            echo
            echo "Available aliases:"
            cat "$PRIVATE_ALIASES"
            echo
            echo "Update the GitHub KEY_ALIAS secret with one of the exact aliases above."
            exit 1
          fi

          echo "Configured KEY_ALIAS matches a PrivateKeyEntry."

          echo
          echo "Running final alias validation..."

          set +e

          keytool -list \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > selected-alias-information.txt 2>&1

          ALIAS_STATUS=$?

          set -e

          cat selected-alias-information.txt

          if [[ "$ALIAS_STATUS" -ne 0 ]]; then
            echo "::error::Final alias validation failed."
            exit 1
          fi

          cp "$STORE_LOG" keystore-information.txt

          echo
          echo "============================================================"
          echo "PKCS12 VALIDATION SUCCESSFUL"
          echo "============================================================"

      # =========================================================
      # 10. Verify ENABLE1 dictionary
      # =========================================================
      - name: Verify ENABLE1 dictionary
        shell: bash
        run: |
          trap 'echo "::error::Dictionary verification failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          FILE="app/src/main/assets/dictionary/enable1.txt"

          if [[ ! -s "$FILE" ]]; then
            echo "::error::ENABLE1 dictionary is missing."
            exit 1
          fi

          COUNT="$(wc -l < "$FILE")"

          echo "ENABLE1 word count: $COUNT"

          if [[ "$COUNT" -lt 170000 ]]; then
            echo "::error::ENABLE1 dictionary is incomplete."
            exit 1
          fi

      # =========================================================
      # 11. Verify Gradle wrapper
      # =========================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          trap 'echo "::error::Gradle wrapper failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          chmod +x ./gradlew
          ./gradlew --version

      # =========================================================
      # 12. Run tests and build signed release
      # =========================================================
      - name: Test and build signed APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WORD_BATTLE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WORD_BATTLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORD_BATTLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          trap 'echo "::error::Gradle build failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          if [[ ! -s "$WORD_BATTLE_KEYSTORE_PATH" ]]; then
            echo "::error::PKCS12 keystore is unavailable."
            exit 1
          fi

          echo "Running unit tests..."

          ./gradlew \
            --no-daemon \
            testDebugUnitTest \
            --stacktrace

          echo "Building release APK..."

          ./gradlew \
            --no-daemon \
            assembleRelease \
            --stacktrace

      # =========================================================
      # 13. Locate final APK and apksigner
      # =========================================================
      - name: Locate release APK
        shell: bash
        run: |
          trap 'echo "::error::APK discovery failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APK_PATH="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "::error::Release APK was not found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            find "$SDK_ROOT/build-tools" -name apksigner 2>/dev/null || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$APKSIGNER" >> "$GITHUB_ENV"

          echo "Release APK: $APK_PATH"
          echo "APK signer: $APKSIGNER"
          ls -lh "$APK_PATH"

      # =========================================================
      # 14. Verify final APK signature
      # =========================================================
      - name: Verify final APK signature
        shell: bash
        run: |
          trap 'echo "::error::APK signature verification failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          "$APKSIGNER_PATH" verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee apk-certificate.txt

      # =========================================================
      # 15. Generate Google-format SHA-1 and SHA-256
      # =========================================================
      - name: Generate certificate fingerprints
        id: fingerprints
        shell: bash
        run: |
          trap 'echo "::error::Fingerprint generation failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          apk_text = Path("apk-certificate.txt").read_text(
              encoding="utf-8",
              errors="replace"
          )

          keytool_text = Path("keystore-information.txt").read_text(
              encoding="utf-8",
              errors="replace"
          )

          sha1_match = re.search(
              r"certificate SHA-1 digest:\s*([0-9a-fA-F:]+)",
              apk_text,
              re.IGNORECASE
          )

          sha256_match = re.search(
              r"certificate SHA-256 digest:\s*([0-9a-fA-F:]+)",
              apk_text,
              re.IGNORECASE
          )

          if not sha1_match:
              sha1_match = re.search(
                  r"SHA1:\s*([0-9a-fA-F:]+)",
                  keytool_text,
                  re.IGNORECASE
              )

          if not sha256_match:
              sha256_match = re.search(
                  r"SHA256:\s*([0-9a-fA-F:]+)",
                  keytool_text,
                  re.IGNORECASE
              )

          if not sha1_match:
              raise SystemExit("SHA-1 fingerprint was not found")

          if not sha256_match:
              raise SystemExit("SHA-256 fingerprint was not found")

          def google_format(value):
              clean = re.sub(
                  r"[^0-9a-fA-F]",
                  "",
                  value
              ).upper()

              return ":".join(
                  clean[index:index + 2]
                  for index in range(0, len(clean), 2)
              )

          sha1 = google_format(sha1_match.group(1))
          sha256 = google_format(sha256_match.group(1))

          content = f"""WORD BATTLE SIGNING CERTIFICATE
          =================================

          Package name: com.wordbattle.com
          Keystore type: PKCS12

          SHA-1:
          {sha1}

          SHA-256:
          {sha256}
          """

          Path("signing-fingerprints.txt").write_text(
              content,
              encoding="utf-8"
          )

          print("=" * 60)
          print("FINAL APK SIGNING FINGERPRINTS")
          print("=" * 60)
          print("Package  : com.wordbattle.com")
          print(f"SHA-1    : {sha1}")
          print(f"SHA-256  : {sha256}")
          print("=" * 60)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"sha1={sha1}\n")
              output.write(f"sha256={sha256}\n")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as summary:
              summary.write("## 🔐 APK Signing Certificate\n\n")
              summary.write("| Type | Fingerprint |\n")
              summary.write("|---|---|\n")
              summary.write(f"| **SHA-1** | `{sha1}` |\n")
              summary.write(f"| **SHA-256** | `{sha256}` |\n\n")
              summary.write("**Package:** `com.wordbattle.com`\n\n")
              summary.write("**Keystore:** PKCS#12\n")
          PY

          cat signing-fingerprints.txt

      # =========================================================
      # 16. Prepare downloadable artifact
      # =========================================================
      - name: Prepare signed APK artifact
        shell: bash
        run: |
          trap 'echo "::error::Artifact preparation failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          mkdir -p signed-artifact

          OUTPUT_APK="signed-artifact/WordBattle-build-${GITHUB_RUN_NUMBER}-signed.apk"

          cp "$APK_PATH" "$OUTPUT_APK"
          cp apk-certificate.txt signed-artifact/apk-certificate.txt
          cp signing-fingerprints.txt signed-artifact/signing-fingerprints.txt

          sha256sum "$OUTPUT_APK" \
            | tee signed-artifact/SHA256SUMS.txt

          echo "Artifact files:"
          ls -lh signed-artifact

      # =========================================================
      # 17. Upload signed APK
      # =========================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WordBattle-PKCS12-signed-${{ github.run_number }}
          path: signed-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # =========================================================
      # 18. Attach to GitHub Release when using v* tag
      # =========================================================
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::GitHub Release failed at line $LINENO: $BASH_COMMAND"' ERR
          set -Eeuo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              signed-artifact/* \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              signed-artifact/* \
              --title "Word Battle $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # =========================================================
      # 19. Always remove temporary private keystore
      # =========================================================
      - name: Remove temporary PKCS12 keystore
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/wordbattle-release.p12"
          echo "Temporary PKCS12 keystore removed."
