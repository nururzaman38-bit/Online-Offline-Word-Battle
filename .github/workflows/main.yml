name: Build signed release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/019ffe69-online-offline-word-battle
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    name: Test and build owner-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore and validate only the owner keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required signing secret is missing: ${secret_name}"
              exit 1
            fi
          done

          KEYSTORE_PATH="$GITHUB_WORKSPACE/wordbattle-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "WORD_BATTLE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Verify bundled ENABLE dictionary
        shell: bash
        run: |
          test -s app/src/main/assets/dictionary/enable1.txt
          test "$(wc -l < app/src/main/assets/dictionary/enable1.txt)" -gt 170000

      - name: Run unit tests and build signed release APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WORD_BATTLE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WORD_BATTLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORD_BATTLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleRelease --stacktrace

      - name: Verify APK signature and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-certificate.txt

          mkdir -p signed-artifact
          OUTPUT="signed-artifact/WordBattle-v1.0.0-build-${GITHUB_RUN_NUMBER}-signed.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" | tee signed-artifact/SHA256SUMS.txt
          cp signing-certificate.txt signed-artifact/signing-certificate.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordBattle-signed-${{ github.run_number }}
          path: signed-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Attach signed APK to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" signed-artifact/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" signed-artifact/* \
              --title "Word Battle ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Remove keystore from runner
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/wordbattle-release.jks"
