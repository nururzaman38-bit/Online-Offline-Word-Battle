name: Build signed release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    name: Test and build PKCS12 owner-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # 2. Set up Java
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # =========================================================
      # 3. Set up Android SDK
      # =========================================================
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      # =========================================================
      # 4. Install Android API 36
      # =========================================================
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are not set."
            exit 1
          fi

          echo "Android SDK root: $SDK_ROOT"
          echo "SDK Manager version:"
          sdkmanager --version

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          if [[ ! -d "$SDK_ROOT/platforms/android-36" ]]; then
            echo "::error::Android API 36 was not installed."
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "::error::Android Build Tools 36.0.0 were not installed."
            exit 1
          fi

          echo "Android API 36 installed successfully."

      # =========================================================
      # 5. Configure project for available API 36
      # These changes are temporary and are never committed
      # =========================================================
      - name: Configure project for Android API 36
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")

          if not gradle_file.is_file():
              raise SystemExit("app/build.gradle.kts was not found")

          content = gradle_file.read_text(encoding="utf-8")

          replacements = {
              "compileSdk = 37":
                  "compileSdk = 36",

              "targetSdk = 37":
                  "targetSdk = 36",

              "androidx.compose:compose-bom:2026.08.00":
                  "androidx.compose:compose-bom:2026.06.01",

              "androidx.core:core-ktx:1.19.0":
                  "androidx.core:core-ktx:1.18.0",

              "androidx.lifecycle:lifecycle-runtime-compose:2.11.0":
                  "androidx.lifecycle:lifecycle-runtime-compose:2.10.0",

              "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0":
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0",
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(
                      f"Expected Gradle configuration was not found: {old}"
                  )

              content = content.replace(old, new)

          gradle_file.write_text(content, encoding="utf-8")

          print("Android API 36 compatibility settings applied.")
          PY

          echo "Effective build configuration:"

          grep -nE \
            "compileSdk|targetSdk|compose-bom|core-ktx|lifecycle-runtime-compose|lifecycle-viewmodel-compose" \
            app/build.gradle.kts

          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'lifecycle-runtime-compose:2.10.0' app/build.gradle.kts
          grep -q 'lifecycle-viewmodel-compose:2.10.0' app/build.gradle.kts

      # =========================================================
      # 6. Set up Gradle
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 7. Validate required secrets
      # =========================================================
      - name: Validate required GitHub secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          MISSING_SECRET=0

          for SECRET_NAME in \
            KEYSTORE_BASE64 \
            STORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [[ -z "${!SECRET_NAME:-}" ]]; then
              echo "::error::Missing GitHub repository secret: $SECRET_NAME"
              MISSING_SECRET=1
            fi
          done

          if [[ "$MISSING_SECRET" -ne 0 ]]; then
            echo "::error::Add all required signing secrets."
            exit 1
          fi

          echo "All required signing secrets are available."

      # =========================================================
      # 8. Restore PKCS#12 keystore from encrypted secret
      # =========================================================
      - name: Restore owner PKCS12 keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$GITHUB_WORKSPACE/wordbattle-release.p12"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded PKCS12 keystore is empty."
            exit 1
          fi

          echo "WORD_BATTLE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "PKCS12 keystore restored successfully."
          echo "Keystore size: $(wc -c < "$KEYSTORE_PATH") bytes"

      # =========================================================
      # 9. Validate PKCS#12 keystore, password and alias
      # =========================================================
      - name: Validate PKCS12 keystore and alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ ! -s "$WORD_BATTLE_KEYSTORE_PATH" ]]; then
            echo "::error::PKCS12 keystore is unavailable."
            exit 1
          fi

          keytool -list \
            -v \
            -storetype PKCS12 \
            -keystore "$WORD_BATTLE_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > keystore-information.txt

          echo "PKCS12 keystore password and alias are valid."

      # =========================================================
      # 10. Extract owner keystore fingerprints before build
      # =========================================================
      - name: Read PKCS12 certificate fingerprints
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -v \
            -storetype PKCS12 \
            -keystore "$WORD_BATTLE_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | tee owner-keystore-certificate.txt

          KEYSTORE_SHA1="$(
            grep -m 1 'SHA1:' owner-keystore-certificate.txt \
              | sed 's/.*SHA1:[[:space:]]*//' \
              | tr -d '\r'
          )"

          KEYSTORE_SHA256="$(
            grep -m 1 'SHA256:' owner-keystore-certificate.txt \
              | sed 's/.*SHA256:[[:space:]]*//' \
              | tr -d '\r'
          )"

          if [[ -z "$KEYSTORE_SHA1" ]]; then
            echo "::error::Unable to read keystore SHA-1."
            exit 1
          fi

          if [[ -z "$KEYSTORE_SHA256" ]]; then
            echo "::error::Unable to read keystore SHA-256."
            exit 1
          fi

          {
            echo "OWNER PKCS12 KEYSTORE FINGERPRINTS"
            echo "================================"
            echo
            echo "SHA-1:"
            echo "$KEYSTORE_SHA1"
            echo
            echo "SHA-256:"
            echo "$KEYSTORE_SHA256"
          } | tee owner-keystore-fingerprints.txt

          echo "Owner keystore SHA-1   : $KEYSTORE_SHA1"
          echo "Owner keystore SHA-256 : $KEYSTORE_SHA256"

      # =========================================================
      # 11. Verify ENABLE1 dictionary
      # =========================================================
      - name: Verify bundled ENABLE dictionary
        shell: bash
        run: |
          set -euo pipefail

          DICTIONARY_PATH="app/src/main/assets/dictionary/enable1.txt"

          if [[ ! -s "$DICTIONARY_PATH" ]]; then
            echo "::error::ENABLE1 dictionary is missing or empty."
            exit 1
          fi

          WORD_COUNT="$(wc -l < "$DICTIONARY_PATH")"

          echo "ENABLE1 word count: $WORD_COUNT"

          if [[ "$WORD_COUNT" -lt 170000 ]]; then
            echo "::error::ENABLE1 dictionary is incomplete."
            exit 1
          fi

      # =========================================================
      # 12. Make Gradle executable
      # =========================================================
      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # =========================================================
      # 13. Run unit tests
      # =========================================================
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            testDebugUnitTest \
            --stacktrace

      # =========================================================
      # 14. Build owner-signed release APK
      # =========================================================
      - name: Build PKCS12 owner-signed release APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WORD_BATTLE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          WORD_BATTLE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORD_BATTLE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! -s "$WORD_BATTLE_KEYSTORE_PATH" ]]; then
            echo "::error::Owner PKCS12 keystore is unavailable."
            exit 1
          fi

          ./gradlew \
            --no-daemon \
            assembleRelease \
            --stacktrace

      # =========================================================
      # 15. Verify final APK and extract SHA-1/SHA-256
      # =========================================================
      - name: Verify APK and generate signing fingerprints
        id: signing_fingerprints
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Release APK was not generated: $APK_PATH"
            exit 1
          fi

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found: $APKSIGNER"
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee signing-certificate.txt

          SHA1_RAW="$(
            sed -n \
              's/^Signer #1 certificate SHA-1 digest: //p' \
              signing-certificate.txt \
              | head -n 1 \
              | tr -d '\r'
          )"

          SHA256_RAW="$(
            sed -n \
              's/^Signer #1 certificate SHA-256 digest: //p' \
              signing-certificate.txt \
              | head -n 1 \
              | tr -d '\r'
          )"

          if [[ -z "$SHA1_RAW" ]]; then
            echo "::error::Unable to extract APK SHA-1 fingerprint."
            exit 1
          fi

          if [[ -z "$SHA256_RAW" ]]; then
            echo "::error::Unable to extract APK SHA-256 fingerprint."
            exit 1
          fi

          SHA1_FINGERPRINT="$(
            echo "$SHA1_RAW" \
              | tr '[:lower:]' '[:upper:]' \
              | sed 's/../&:/g; s/:$//'
          )"

          SHA256_FINGERPRINT="$(
            echo "$SHA256_RAW" \
              | tr '[:lower:]' '[:upper:]' \
              | sed 's/../&:/g; s/:$//'
          )"

          {
            echo "WORD BATTLE FINAL APK FINGERPRINTS"
            echo "=================================="
            echo
            echo "Package: com.wordbattle.com"
            echo
            echo "Keystore type: PKCS12"
            echo
            echo "SHA-1:"
            echo "$SHA1_FINGERPRINT"
            echo
            echo "SHA-256:"
            echo "$SHA256_FINGERPRINT"
          } | tee signing-fingerprints.txt

          echo
          echo "============================================================"
          echo "FINAL SIGNED APK FINGERPRINTS"
          echo "============================================================"
          echo "Package  : com.wordbattle.com"
          echo "SHA-1    : $SHA1_FINGERPRINT"
          echo "SHA-256  : $SHA256_FINGERPRINT"
          echo "============================================================"

          echo "sha1=$SHA1_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_FINGERPRINT" >> "$GITHUB_OUTPUT"

          {
            echo "## 🔐 Final APK Signing Certificate"
            echo
            echo "| Type | Fingerprint |"
            echo "|---|---|"
            echo "| **SHA-1** | \`$SHA1_FINGERPRINT\` |"
            echo "| **SHA-256** | \`$SHA256_FINGERPRINT\` |"
            echo
            echo "**Package:** \`com.wordbattle.com\`"
            echo
            echo "**Keystore:** PKCS#12"
          } >> "$GITHUB_STEP_SUMMARY"

      # =========================================================
      # 16. Prepare APK artifact
      # =========================================================
      - name: Prepare signed APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          mkdir -p signed-artifact

          OUTPUT_APK="signed-artifact/WordBattle-v1.0.0-build-${GITHUB_RUN_NUMBER}-signed.apk"

          cp "$APK_PATH" "$OUTPUT_APK"

          cp \
            signing-certificate.txt \
            signed-artifact/signing-certificate.txt

          cp \
            signing-fingerprints.txt \
            signed-artifact/signing-fingerprints.txt

          cp \
            owner-keystore-fingerprints.txt \
            signed-artifact/owner-keystore-fingerprints.txt

          sha256sum "$OUTPUT_APK" \
            | tee signed-artifact/SHA256SUMS.txt

          echo "Prepared files:"
          ls -lh signed-artifact/

      # =========================================================
      # 17. Upload signed artifact
      # =========================================================
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordBattle-PKCS12-signed-${{ github.run_number }}
          path: signed-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # =========================================================
      # 18. Attach to GitHub Release for v* tags
      # =========================================================
      - name: Attach signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG_NAME="$GITHUB_REF_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload \
              "$TAG_NAME" \
              signed-artifact/* \
              --clobber
          else
            gh release create \
              "$TAG_NAME" \
              signed-artifact/* \
              --title "Word Battle $TAG_NAME" \
              --generate-notes
          fi

      # =========================================================
      # 19. Always remove temporary private keystore
      # =========================================================
      - name: Remove temporary PKCS12 keystore
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/wordbattle-release.p12"
          echo "Temporary PKCS12 keystore removed."
